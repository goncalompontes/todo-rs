[package]
name = "todo-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared library for the todo.txt Rust tooling (config, task model, store, deps, parser, plugins)."

[dependencies]
chumsky = "0.13"
ariadne = "0.6"
anstyle = "1"
terminal-link = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
shellexpand = "3"
